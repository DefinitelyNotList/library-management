spring.application.name=librario

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://<YOUR_HOST>:3306/<YOUR_DB_NAME>?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=<YOUR_DB_USERNAME>
spring.datasource.password=<YOUR_DB_PASSWORD>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Port (optional)
server.port=8080

# Use a random Base64/string secret of at least 32 bytes. Do not commit it.
app.jwt.secret=${JWT_SECRET}

# Mail Settings
spring.mail.host=YOUR_MAIL_HOST
spring.mail.port=YOUR_MAIL_PORT
spring.mail.username=YOUR_MAIL_USERNAME
spring.mail.password=YOUR_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
