# Demo fallback settings to allow starting the app when external DB is not yet configured.
# For production, DO NOT keep these defaults — set proper datasource and remove this file or override with env vars.

# Force Hibernate dialect to MySQL to avoid trying to infer it from JDBC metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Avoid Hibernate attempting to create/validate schema on startup for demo
spring.jpa.hibernate.ddl-auto=none

# Use Render's assigned port when deployed
server.port=${PORT:8080}

# Read database connection from env vars; override defaults in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/librarymanagementdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool settings (tuned for Render free tier + Aiven MySQL)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# Logging - show startup errors clearly
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
