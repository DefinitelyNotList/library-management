# Demo fallback settings to allow starting the app when external DB is not yet configured.
# For production, DO NOT keep these defaults — set proper datasource and remove this file or override with env vars.

# Force Hibernate dialect to SQL Server to avoid trying to infer it from JDBC metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Avoid Hibernate attempting to create/validate schema on startup for demo
spring.jpa.hibernate.ddl-auto=none

# Optional: reduce logging noise
logging.level.org.hibernate=ERROR

# Use Render's assigned port when deployed
server.port=${PORT:8080}

# Read database connection from env vars; override defaults in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=LibraryManagementDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
