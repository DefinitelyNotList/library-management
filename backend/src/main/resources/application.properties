# Demo fallback settings to allow starting the app when external DB is not yet configured.
# For production, DO NOT keep these defaults — set proper datasource and remove this file or override with env vars.

# Force Hibernate dialect to MySQL to avoid trying to infer it from JDBC metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Avoid Hibernate attempting to create/validate schema on startup for demo
spring.jpa.hibernate.ddl-auto=none

# Preserve exact table name casing from @Table annotations (prevents Users -> users lowering)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Use Render's assigned port when deployed
server.port=${PORT:8080}

# Read database connection from env vars; override defaults in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/librarymanagementdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool settings (tuned for low latency on Render + Aiven MySQL)
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# Tắt Open-In-View để tối ưu tài nguyên DB và loại bỏ cảnh báo OSIV
spring.jpa.open-in-view=false

# Logging - show startup errors clearly
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

